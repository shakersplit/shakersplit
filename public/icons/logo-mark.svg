<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShakerSplit brand mark — TRANSPARENT background variant.
  Use this for in-app overlays (sidebar, header) where the surrounding container already has its
  own background. Same geometry as logo.svg but no rounded square behind the bands.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="ShakerSplit">
  <defs>
    <linearGradient id="mGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <linearGradient id="mOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="mPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BA68C8"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>
  </defs>
  <rect x="120" y="112" width="304" height="80" rx="40" fill="url(#mGreen)"/>
  <rect x="88" y="216" width="336" height="80" rx="40" fill="url(#mOrange)"/>
  <rect x="88" y="320" width="304" height="80" rx="40" fill="url(#mPurple)"/>
</svg>

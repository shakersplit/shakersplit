<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShakerSplit brand mark — tri-color split.
  Three rounded bands stacked into an "S"-like silhouette using the three pillar colors:
    Green  #4CAF50  food
    Orange #FF9800  workout
    Purple #9C27B0  alcohol
  Designed at 512×512 with a 96px corner radius and 64px safe padding so it scales cleanly
  from 16x16 favicon up to 1024x1024 app store icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="ShakerSplit logo">
  <defs>
    <linearGradient id="ssGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <linearGradient id="ssOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="ssPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BA68C8"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>
    <linearGradient id="ssBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background — matches Apple icon style -->
  <rect width="512" height="512" rx="112" fill="url(#ssBg)"/>

  <!-- Top band — food green, offset right (S top curve) -->
  <rect x="120" y="112" width="304" height="80" rx="40" fill="url(#ssGreen)"/>

  <!-- Middle band — workout orange, centered -->
  <rect x="88" y="216" width="336" height="80" rx="40" fill="url(#ssOrange)"/>

  <!-- Bottom band — alcohol purple, offset left (S bottom curve) -->
  <rect x="88" y="320" width="304" height="80" rx="40" fill="url(#ssPurple)"/>
</svg>
